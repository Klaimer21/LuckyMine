name: tests

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Import project (first run builds the .godot cache)
        run: godot --headless --path . --import || true
      - name: Logic tests
        run: |
          godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee test.log
          grep -q "failed 0" test.log
      - name: Fuzz (short, headless)
        run: |
          godot --headless --path . --script res://tests/fuzz_driver.gd -- 1 1500 2>&1 | tee fuzz.log
          grep -q "bugs=0" fuzz.log
          ! grep -q "SCRIPT ERROR" fuzz.log
      - name: Static checks (refs, names, translations)
        run: |
          apt-get update -qq && apt-get install -y -qq python3 python3-pip
          pip3 install --quiet gdtoolkit==4.* || true
          sh tools/check_all.sh

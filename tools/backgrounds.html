<!doctype html>
<html><head><meta charset="utf-8"><title>LuckyMine backgrounds</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Фоны зон LuckyMine: сдержанная палитра, слои скальной породы, один акцент на зону. Рисуется на canvas,
// tools/make_backgrounds.py сохраняет в assets/bg/background_N.jpg. Меняйте ZONES и функции props*.
const W = 1080, H = 1920;
const cv = document.getElementById('c'), g = cv.getContext('2d');
function rng(seed){ let s = seed|0; return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex = c => c;
const ZONES = [
  {name:'quarry', top:'#0a1110', mid:'#16201e', low:'#0b1110', wall:['#1c2725','#243230','#2f3d3a'], accent:'#c9a45c', glow:'rgba(201,164,92,0.10)'},
  {name:'copper', top:'#0f0c0a', mid:'#211812', low:'#0d0a08', wall:['#2a1e16','#382a1e','#4a3624'], accent:'#c77a4d', glow:'rgba(199,122,77,0.16)'},
  {name:'iron',   top:'#090c11', mid:'#141a23', low:'#080b10', wall:['#1b222c','#252f3c','#33404f'], accent:'#8aa0bf', glow:'rgba(138,160,191,0.14)'},
  {name:'gold',   top:'#0f0c07', mid:'#241c0e', low:'#0c0905', wall:['#2e2410','#3d3015','#52401b'], accent:'#e0b64a', glow:'rgba(224,182,74,0.20)'},
  {name:'crystal',top:'#050e11', mid:'#0c2229', low:'#050c0f', wall:['#10303a','#17424f','#235a69'], accent:'#7fdbe6', glow:'rgba(127,219,230,0.22)'},
  {name:'magma',  top:'#0e0706', mid:'#2a0f0a', low:'#0b0504', wall:['#2c1310','#401a14','#5a2318'], accent:'#ff7a3d', glow:'rgba(255,122,61,0.28)'},
  {name:'core',   top:'#0a0608', mid:'#2a1208', low:'#0a0507', wall:['#2e170c','#4a230e','#6a3412'], accent:'#ffb347', glow:'rgba(255,179,71,0.38)'},
];
// Марс (планета 1): ржавые породы и пыль, у каждой зоны свой акцент
const MARS = [
  {name:'dust',   top:'#150b07', mid:'#2b150d', low:'#120a06', wall:['#341a10','#46231a','#5a3020'], accent:'#d9925a', glow:'rgba(217,146,90,0.14)'},
  {name:'oxide',  top:'#170a06', mid:'#33150c', low:'#140806', wall:['#3d1a0f','#522314','#6b301b'], accent:'#e0703a', glow:'rgba(224,112,58,0.18)'},
  {name:'basalt', top:'#0d0a0b', mid:'#231a1b', low:'#0c0909', wall:['#2a1f20','#382a2b','#4a3a3a'], accent:'#b8908a', glow:'rgba(184,144,138,0.14)'},
  {name:'sulfur', top:'#140f05', mid:'#2e2209', low:'#110c04', wall:['#3a2a0c','#4c3810','#664c16'], accent:'#e8c24a', glow:'rgba(232,194,74,0.20)'},
  {name:'ice',    top:'#0a0d10', mid:'#17242c', low:'#080c0f', wall:['#1f323c','#2b4655','#3c6074'], accent:'#bfe3f2', glow:'rgba(191,227,242,0.20)'},
  {name:'magma',  top:'#150605', mid:'#33100a', low:'#0e0504', wall:['#3a120c','#52190f','#702416'], accent:'#ff6a3a', glow:'rgba(255,106,58,0.30)'},
  {name:'core',   top:'#120605', mid:'#35120a', low:'#0c0504', wall:['#40170c','#5e230f','#833314'], accent:'#ffa24a', glow:'rgba(255,162,74,0.40)'},
];
const PLANET_ZONES = {1: MARS};
function lerpColor(a, b, t){ const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16); const r = ((pa>>16)&255)*(1-t)+((pb>>16)&255)*t, gg = ((pa>>8)&255)*(1-t)+((pb>>8)&255)*t, bb = (pa&255)*(1-t)+(pb&255)*t; return `rgb(${r|0},${gg|0},${bb|0})`; }

function base(z, r){
  const gr = g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0, z.top); gr.addColorStop(0.45, z.mid); gr.addColorStop(1, z.low);
  g.fillStyle = gr; g.fillRect(0,0,W,H);
}
// скальная масса по бокам: ломаный край с шумом, три слоя от дальнего к ближнему
function walls(z, r){
  for (let layer = 0; layer < 3; layer++){
    const col = z.wall[layer], inset = 90 + layer * 70, wob = 60 + layer * 30;
    for (const side of [0,1]){
      g.beginPath();
      const x0 = side ? W : 0, dir = side ? -1 : 1;
      g.moveTo(x0, 0);
      let y = 0;
      const edgePts = [];
      while (y <= H){
        const edge = inset * (0.6 + 0.8 * Math.pow(Math.sin(y / 380 + layer * 1.7 + side), 2)) + (r() - 0.5) * wob;
        const px = x0 + dir * Math.max(10, edge);
        g.lineTo(px, y); edgePts.push([px, y]);
        y += 40 + r() * 70;
      }
      g.lineTo(x0, H); g.closePath();
      g.fillStyle = col; g.globalAlpha = 0.95 - layer * 0.1; g.fill();
      // кромка света на стороне к центру: объём
      g.globalAlpha = 0.10 + layer * 0.05; g.strokeStyle = z.accent; g.lineWidth = 3; g.lineJoin = 'round';
      g.beginPath(); edgePts.forEach((p, k) => k ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke();
    }
  }
  g.globalAlpha = 1;
}
// сталактиты сверху, потемнее
function ceiling(z, r){
  g.fillStyle = z.top;
  for (let i = 0; i < 26; i++){
    const x = r() * W, w = 30 + r() * 90, h = 70 + r() * 260;
    g.beginPath(); g.moveTo(x - w/2, -10); g.lineTo(x + (r()-0.5)*20, h); g.lineTo(x + w/2, -10); g.closePath();
    g.globalAlpha = 0.55 + r() * 0.4; g.fill();
  }
  g.globalAlpha = 1;
}
// слои породы: горизонтальные прожилки
function strata(z, r){
  g.lineWidth = 2;
  for (let i = 0; i < 70; i++){
    const y = r() * H, side = r() < 0.5 ? 0 : 1, len = 80 + r() * 260;
    g.strokeStyle = `rgba(255,255,255,${0.02 + r() * 0.03})`;
    const x = side ? W - len - r() * 40 : r() * 40;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + len, y + (r() - 0.5) * 24); g.stroke();
  }
}
function glow(z, cx, cy, rad){
  const gr = g.createRadialGradient(cx, cy, 10, cx, cy, rad);
  gr.addColorStop(0, z.glow); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}
function shafts(z, r, n){
  for (let i = 0; i < n; i++){
    const x = 150 + r() * (W - 300), w = 50 + r() * 90;
    const gr = g.createLinearGradient(0, 0, 0, 1100);
    gr.addColorStop(0, z.glow); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr;
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x + w, 0); g.lineTo(x + w * 3 + (r()-0.5)*160, 1100); g.lineTo(x - w * 2, 1100); g.closePath(); g.globalAlpha = 0.55; g.fill();
  }
  g.globalAlpha = 1;
}
// деревянная крепь: стойки и перекладина
function terraces(z, r){
  for (let i = 0; i < 9; i++){
    const y = 260 + i * 170 + r() * 40;
    for (const side of [0, 1]){
      const len = 160 + r() * 120, x = side ? W - len : 0;
      g.fillStyle = 'rgba(255,255,255,0.05)'; g.fillRect(x, y, len, 10);
      g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(x, y + 10, len, 18);
    }
  }
}
function timber(z, r, xs){
  for (const x of xs){
    g.fillStyle = '#2a1c10'; g.fillRect(x - 22, 160, 44, H - 160);
    g.fillStyle = 'rgba(255,255,255,0.04)'; g.fillRect(x - 22, 160, 8, H - 160);
    g.fillStyle = '#33220f'; g.fillRect(x - 70, 160, 140, 40);
    g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(x - 70, 196, 140, 8);
  }
}
function girders(z, r, ys){
  for (const y of ys){
    g.fillStyle = '#222b36'; g.fillRect(0, y, W, 34);
    g.fillStyle = 'rgba(255,255,255,0.06)'; g.fillRect(0, y, W, 5);
    g.fillStyle = 'rgba(0,0,0,0.4)'; g.fillRect(0, y + 28, W, 6);
    g.fillStyle = '#3a4656';
    for (let x = 30; x < W; x += 90){ g.beginPath(); g.arc(x, y + 17, 5, 0, 7); g.fill(); }
  }
}
function lamps(z, r, pts){
  for (const [x, y] of pts){
    g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = 3; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, y); g.stroke();
    const gr = g.createRadialGradient(x, y, 4, x, y, 150);
    gr.addColorStop(0, z.glow.replace(/[\d.]+\)$/, '0.55)')); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - 160, y - 160, 320, 320);
    g.fillStyle = z.accent; g.beginPath(); g.arc(x, y, 9, 0, 7); g.fill();
  }
}
function veins(z, r, count){
  g.lineCap = 'round';
  for (let i = 0; i < count; i++){
    const side = r() < 0.5 ? 0 : 1; let x = side ? W - 20 - r() * 150 : 20 + r() * 150, y = r() * H;
    g.strokeStyle = z.accent; g.lineWidth = 3 + r() * 4; g.globalAlpha = 0.5 + r() * 0.3;
    const pts = [[x, y]];
    for (let k = 0; k < 5; k++){ x += (side ? -1 : 1) * (10 + r() * 45); y += (r() - 0.3) * 120; pts.push([x, y]); }
    smooth(pts); g.stroke();
  }
  g.globalAlpha = 1;
}
function flecks(z, r, count){
  for (let i = 0; i < count; i++){
    const side = r() < 0.5 ? 0 : 1, x = side ? W - r() * 200 : r() * 200, y = r() * H, s = 3 + r() * 7;
    g.fillStyle = z.accent; g.globalAlpha = 0.35 + r() * 0.5;
    g.beginPath(); g.moveTo(x, y - s); g.lineTo(x + s, y); g.lineTo(x, y + s); g.lineTo(x - s, y); g.closePath(); g.fill();
  }
  g.globalAlpha = 1;
}
function crystal(z, x, y, h, w, tilt, shade){
  g.save(); g.translate(x, y); g.rotate(tilt);
  const face = (x0, x1, col) => { g.fillStyle = col; g.beginPath(); g.moveTo(x0, 0); g.lineTo(x0, -h * 0.72); g.lineTo((x0 + x1) / 2, -h); g.lineTo(x1, -h * 0.72); g.lineTo(x1, 0); g.closePath(); g.fill(); };
  face(-w/2, 0, lerpColor('#0e3a45', z.accent, 0.25 + shade * 0.2));
  face(0, w/2, lerpColor('#0a2a33', z.accent, 0.10 + shade * 0.15));
  g.fillStyle = 'rgba(255,255,255,0.12)'; g.beginPath(); g.moveTo(-w/2, -h*0.72); g.lineTo(0, -h); g.lineTo(0, -h*0.72); g.closePath(); g.fill();
  g.restore();
}
function crystals(z, r, count){
  for (let i = 0; i < count; i++){
    const side = r() < 0.5 ? 0 : 1, x = side ? W - 20 - r() * 170 : 20 + r() * 170, y = 300 + r() * 1300;
    const gr = g.createRadialGradient(x, y - 60, 5, x, y - 60, 170);
    gr.addColorStop(0, 'rgba(127,219,230,0.25)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - 180, y - 240, 360, 360);
    crystal(z, x, y, 90 + r() * 200, 40 + r() * 50, (r() - 0.5) * 0.7, r());
  }
}
function smooth(pts){
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let k = 1; k < pts.length - 1; k++){
    const mx = (pts[k][0] + pts[k+1][0]) / 2, my = (pts[k][1] + pts[k+1][1]) / 2;
    g.quadraticCurveTo(pts[k][0], pts[k][1], mx, my);
  }
  g.lineTo(pts[pts.length-1][0], pts[pts.length-1][1]);
}
function lava(z, r){
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (let i = 0; i < 7; i++){
    let x = r() < 0.5 ? 20 + r() * 190 : W - 20 - r() * 190, y = r() * H * 0.7;
    const pts = [[x, y]];
    for (let k = 0; k < 6; k++){ x += (r() - 0.5) * 90; y += 90 + r() * 150; pts.push([x, y]); }
    for (const [lw, col] of [[34, 'rgba(255,90,30,0.08)'], [18, 'rgba(255,100,40,0.22)'], [8, 'rgba(255,140,70,0.7)'], [3, 'rgba(255,220,170,0.9)']]){
      g.strokeStyle = col; g.lineWidth = lw; smooth(pts); g.stroke();
    }
  }
}
function embers(z, r, count){
  for (let i = 0; i < count; i++){
    const x = r() * W, y = r() * H, s = 1.5 + r() * 3.5;
    g.fillStyle = z.accent; g.globalAlpha = 0.2 + r() * 0.6; g.beginPath(); g.arc(x, y, s, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
}
function grain(r){
  for (let i = 0; i < 30000; i++){
    g.fillStyle = r() < 0.5 ? 'rgba(255,255,255,0.035)' : 'rgba(0,0,0,0.05)';
    g.fillRect(r() * W, r() * H, 2, 2);
  }
}
function vignette(){
  const gr = g.createRadialGradient(W/2, H*0.46, 300, W/2, H*0.46, 1250);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}

// пыльная дымка у верха: на Марсе воздух не прозрачный
function haze(z, r){
  const gr = g.createLinearGradient(0, 0, 0, H * 0.55);
  gr.addColorStop(0, 'rgba(200,110,60,0.16)'); gr.addColorStop(1, 'rgba(200,110,60,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H * 0.55);
  for (let k = 0; k < 40; k++){
    const x = r() * W, y = r() * H * 0.9, rad = 40 + r() * 140;
    const rg = g.createRadialGradient(x, y, 0, x, y, rad);
    rg.addColorStop(0, 'rgba(210,130,80,0.05)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
}
// ледяные прожилки: синеватые блики на стенах (зона льда)
function iceVeins(z, r, count){
  g.lineCap = 'round';
  for (let i = 0; i < count; i++){
    const side = r() < 0.5 ? 0 : 1; let x = side ? W - 15 - r() * 180 : 15 + r() * 180, y = r() * H;
    g.strokeStyle = 'rgba(210,235,250,0.7)'; g.lineWidth = 2 + r() * 3; g.globalAlpha = 0.25 + r() * 0.3;
    const pts = [[x, y]];
    for (let k = 0; k < 5; k++){ x += (side ? -1 : 1) * (8 + r() * 30); y += (r() - 0.4) * 130; pts.push([x, y]); }
    smooth(pts); g.stroke();
  }
  g.globalAlpha = 1;
}

window.drawZone = function(i, planet){
  const set = (planet && PLANET_ZONES[planet]) || ZONES;
  const z = set[i], r = rng(1234 + i * 77 + (planet || 0) * 9001);
  g.clearRect(0, 0, W, H);
  base(z, r);
  if (planet === 1) haze(z, r);
  if (i === 6){ // ядро: расплавленный центр
    glow(z, W/2, 820, 1100); glow(z, W/2, 820, 520);
  }
  shafts(z, r, i < 3 ? 3 : 1);
  glow(z, W/2, 780, 900);
  walls(z, r);
  strata(z, r);
  ceiling(z, r);
  if (planet === 1){
    switch (i){
      case 0: terraces(z, r); flecks(z, r, 60); break;
      case 1: veins(z, r, 18); flecks(z, r, 80); break;
      case 2: girders(z, r, [210, 1500]); lamps(z, r, [[200, 420], [W - 200, 380]]); break;
      case 3: lamps(z, r, [[170, 360], [W - 170, 430]]); flecks(z, r, 140); veins(z, r, 8); break;
      case 4: iceVeins(z, r, 22); crystals(z, r, 10); embers(z, r, 50); break;
      case 5: lava(z, r); embers(z, r, 120); break;
      case 6: lava(z, r); embers(z, r, 160); break;
    }
  } else switch (i){
    case 0: terraces(z, r); timber(z, r, [150, W - 150]); break;
    case 1: timber(z, r, [130, W - 130]); veins(z, r, 16); break;
    case 2: girders(z, r, [210, 1500]); lamps(z, r, [[200, 420], [W - 200, 380]]); break;
    case 3: lamps(z, r, [[170, 360], [W - 170, 430], [W/2, 250]]); flecks(z, r, 120); veins(z, r, 8); break;
    case 4: crystals(z, r, 14); embers(z, r, 90); break;
    case 5: lava(z, r); embers(z, r, 120); break;
    case 6: lava(z, r); embers(z, r, 160); break;
  }
  grain(r);
  vignette();
  // низ уходит в тёмный цвет панели: там интерфейс
  const gr = g.createLinearGradient(0, H * 0.62, 0, H);
  gr.addColorStop(0, 'rgba(8,13,11,0)'); gr.addColorStop(1, 'rgba(8,13,11,0.85)');
  g.fillStyle = gr; g.fillRect(0, H * 0.62, W, H * 0.38);
};
window.zoneCount = ZONES.length;
</script></body></html>
